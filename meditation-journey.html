<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=375px, initial-scale=1.0">
    <title>Meditation Journey</title>
    <link rel="stylesheet" href="meditation-journey.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFE4D6',
                        secondary: '#B7C4B7'
                    },
                    borderRadius: {
                        'none': '0px',
                        'sm': '4px',
                        DEFAULT: '8px',
                        'md': '12px',
                        'lg': '16px',
                        'xl': '20px',
                        '2xl': '24px',
                        '3xl': '32px',
                        'full': '9999px',
                        'button': '8px'
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body class="w-[375px] h-[762px] mx-auto relative bg-gradient-to-b from-primary/20 to-white">
    <nav class="fixed top-0 w-full bg-white/80 backdrop-blur-md z-50 px-4 py-3 flex items-center justify-between">
        <a href="Guided Meditation Session.html" class="flex items-center">
            <div class="w-8 h-8 flex items-center justify-center">
                <i class="ri-arrow-left-line text-xl"></i>
            </div>
        </a>
        <div class="text-lg font-medium">Meditation Journey</div>
        <div class="w-8 h-8"></div>
    </nav>

    <main class="pt-16 pb-20 px-4 relative min-h-screen">
        <!-- Meditation Section -->
        <div class="relative flex flex-col items-center justify-center pt-8" id="meditationSection">
            <img src="https://public.readdy.ai/ai/img_res/dfd4cb98fb5a41a9c394154c1882ad21.jpg"
                class="absolute top-0 w-full h-[300px] object-cover rounded-3xl opacity-50" alt="Meditation Background" id="sceneImage">
            <div class="relative z-10 flex flex-col items-center">
                <div class="relative w-64 h-64 flex items-center justify-center">
                    <svg class="absolute w-full h-full" viewBox="0 0 120 120">
                        <circle cx="60" cy="60" r="54" fill="none" stroke="#FFE4D6" stroke-width="2" />
                        <circle cx="60" cy="60" r="54" fill="none" stroke="#B7C4B7" stroke-width="4"
                            stroke-dasharray="339.292" stroke-dashoffset="0" transform="rotate(-90 60 60)" id="progressCircle" />
                    </svg>
                    <div class="breathe-circle absolute w-48 h-48 bg-primary/30 rounded-full"></div>
                    <div class="text-xl" id="breathingText">Inhale</div>
                </div>
                <div class="mt-8 flex items-center gap-6">
                    <button class="w-12 h-12 flex items-center justify-center rounded-full bg-white shadow-md"
                        onclick="restartSession()">
                        <i class="ri-restart-line text-xl"></i>
                    </button>
                    <button class="w-16 h-16 flex items-center justify-center rounded-full bg-primary shadow-md"
                        onclick="togglePlayPause()" id="playPauseBtn">
                        <i class="ri-pause-fill text-2xl"></i>
                    </button>
                    <button class="w-12 h-12 flex items-center justify-center rounded-full bg-white shadow-md"
                        onclick="showEndDialog()">
                        <i class="ri-close-line text-xl"></i>
                    </button>
                </div>
                <div class="mt-8 w-full">
                    <div class="flex items-center gap-2 mb-4">
                        <i class="ri-volume-up-line"></i>
                        <input type="range" class="w-full h-1 bg-gray-200 rounded-full appearance-none" min="0"
                            max="100" value="50" id="volumeControl">
                    </div>
                </div>
            </div>
        </div>

        <!-- End Session Dialog -->
        <div id="endSessionDialog" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
            <div class="bg-white rounded-2xl p-6 m-4 w-full max-w-sm">
                <h3 class="text-lg font-medium mb-4">End Session?</h3>
                <p class="text-gray-600 mb-6">Are you sure you want to end your meditation session?</p>
                <div class="flex gap-3">
                    <button onclick="closeEndDialog()" class="flex-1 px-4 py-2 rounded-button border">Cancel</button>
                    <button onclick="endSession()" class="flex-1 px-4 py-2 rounded-button bg-primary">End
                        Session</button>
                </div>
            </div>
        </div>

        <!-- Completion Dialog -->
        <div id="completionDialog" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
            <div class="bg-white rounded-2xl p-6 m-4 w-full max-w-sm">
                <h3 class="text-lg font-medium mb-4">Session Complete!</h3>
                <p class="text-gray-600 mb-6">How was your meditation experience?</p>
                <div class="flex gap-2 justify-center mb-6">
                    <button onclick="rateSession(1)" class="text-2xl hover:scale-110 transition">⭐</button>
                    <button onclick="rateSession(2)" class="text-2xl hover:scale-110 transition">⭐</button>
                    <button onclick="rateSession(3)" class="text-2xl hover:scale-110 transition">⭐</button>
                    <button onclick="rateSession(4)" class="text-2xl hover:scale-110 transition">⭐</button>
                    <button onclick="rateSession(5)" class="text-2xl hover:scale-110 transition">⭐</button>
                </div>
                <textarea placeholder="Share your insights and reflections..."
                    class="w-full px-4 py-2 rounded-button border mb-4 h-24" id="reflectionText"></textarea>
                <div class="flex gap-3">
                    <button onclick="saveInsights()"
                        class="flex-1 px-4 py-2 rounded-button bg-secondary text-white">Save Insights</button>
                    <button onclick="startPainting()" class="flex-1 px-4 py-2 rounded-button bg-primary">Start
                        Painting</button>
                </div>
            </div>
        </div>
    </main>

    <script src="meditation-journey.js"></script>
</body>

</html>
